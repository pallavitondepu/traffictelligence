<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Facebook Login</title>
    <link rel="stylesheet" href="./facebook.css">
</head>
<body>
    <header>
        <img src="./fblogo1.jpg" alt="Facebook Logo" class="logo">
    </header>
    <main>
        <aside>
            <img src="./facebook.jpg" alt="Facebook Image" class="main-img">
            <h1>
                Explore <br>
                the <br>things <br>
                <span>you love.</span>
            </h1>
        </aside>
        <section>
            <h2>Log in to Facebook</h2>
            <input type="text" placeholder="Email address or mobile number">
            <input type="password" placeholder="Password">
            <button class="login-btn">Log in</button>
            <p class="forgot">Forgotten password?</p>
            <button class="create-btn">Create new account</button>
            <p class="meta">Meta</p>
        </section>
    </main>
    <footer>
        <nav class="languages">
            <a href="#">English (UK)</a>
            <a href="#">हिन्दी</a>
            <a href="#">اردو</a>
            <a href="#">தமிழ்</a>
            <a href="#">বাংলা</a>
            <a href="#">मराठी</a>
            <a href="#">తెలుగు</a>
            <a href="#">More languages...</a>
        </nav>
        <nav class="footer-links">
            <a href="#">Sign Up</a>
            <a href="#">Log In</a>
            <a href="#">Messenger</a>
            <a href="#">Facebook Lite</a>
            <a href="#">Video</a>
            <a href="#">Meta Pay</a>
            <a href="#">Meta Store</a>
            <a href="#">Meta Quest</a>
            <a href="#">Instagram</a>
            <a href="#">Threads</a>
            <a href="#">Privacy Policy</a>
        </nav>
    </footer>
</body>

</html>
